services:
  db:
    image: postgres:16-alpine
    container_name: saas_postgres
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_pass
      POSTGRES_DB: saas_db
    ports:
      - "5434:5432"
    volumes:
      - saas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d saas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: saas_fastapi
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://saas_user:saas_pass@db:5432/saas_db
    ports:
      - "8002:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

volumes:
  saas_postgres_data: